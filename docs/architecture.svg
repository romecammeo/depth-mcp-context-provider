<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="700" viewBox="0 0 1200 700" role="img" aria-labelledby="title desc">
  <title id="title">Depth MCP context-provider architecture</title>
  <desc id="desc">A thin MCP stdio wrapper calls authenticated Next.js HTTP routes. Token authentication resolves a workspace and scoped server code reads existing context packs, handoffs, and sources from local SQLite or Supabase.</desc>
  <defs>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse"><path d="M32 0H0V32" fill="none" stroke="#1e293b" stroke-width="1"/></pattern>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#94a3b8"/></marker>
    <style>
      .title{font:700 25px ui-monospace,SFMono-Regular,Menlo,monospace;fill:#f8fafc}.sub{font:14px ui-monospace,SFMono-Regular,Menlo,monospace;fill:#94a3b8}.h{font:700 16px ui-monospace,SFMono-Regular,Menlo,monospace;fill:#f8fafc}.t{font:13px ui-monospace,SFMono-Regular,Menlo,monospace;fill:#cbd5e1}.tiny{font:11px ui-monospace,SFMono-Regular,Menlo,monospace;fill:#94a3b8}.box{fill:#0f172a;stroke-width:2}.flow{fill:none;stroke:#94a3b8;stroke-width:2;marker-end:url(#arrow)}.dash{stroke-dasharray:7 6}.boundary{fill:none;stroke:#475569;stroke-width:1.5;stroke-dasharray:8 6}
    </style>
  </defs>
  <rect width="1200" height="700" fill="#020617"/><rect width="1200" height="700" fill="url(#grid)"/>
  <text x="48" y="54" class="title">Depth MCP context-provider snapshot</text>
  <text x="48" y="80" class="sub">Thin stdio adapter over an authenticated application HTTP seam</text>

  <path class="flow" d="M245 185H350"/><path class="flow" d="M570 185H680"/><path class="flow" d="M850 220V300"/>
  <path class="flow" d="M850 420V495"/><path class="flow dash" d="M245 375H680"/>
  <path class="flow" d="M1025 555H1100"/>

  <rect x="45" y="135" width="200" height="100" rx="10" class="box" stroke="#94a3b8"/>
  <text x="65" y="170" class="h">MCP host/client</text><text x="65" y="198" class="t">stdio JSON-RPC</text><text x="65" y="219" class="tiny">interoperability not tested</text>

  <rect x="350" y="120" width="220" height="130" rx="10" class="box" stroke="#22d3ee"/>
  <text x="370" y="155" class="h">Thin MCP wrapper</text><text x="370" y="183" class="t">5 read-only tools</text><text x="370" y="205" class="t">Bearer propagation</text><text x="370" y="227" class="tiny">No DB, token, or pack logic</text>

  <rect x="680" y="110" width="340" height="140" rx="10" class="box" stroke="#34d399"/>
  <text x="700" y="145" class="h">Next.js /api/mcp read routes</text><text x="700" y="175" class="t">Projects · pack · handoff</text><text x="700" y="197" class="t">source metadata · full source</text><text x="700" y="224" class="tiny">HTTP GET boundary</text>

  <rect x="680" y="300" width="340" height="120" rx="10" class="box" stroke="#fb7185"/>
  <text x="700" y="337" class="h">Bearer authentication</text><text x="700" y="365" class="t">SHA-256 lookup → workspace_id</text><text x="700" y="389" class="tiny">Application-level scoping is critical</text>

  <rect x="45" y="325" width="200" height="100" rx="10" class="box" stroke="#fbbf24"/>
  <text x="65" y="360" class="h">Web session</text><text x="65" y="388" class="t">Issue · list · revoke</text><text x="65" y="410" class="tiny">Not exposed as MCP tools</text>

  <rect x="680" y="495" width="345" height="130" rx="10" class="box" stroke="#a78bfa"/>
  <text x="700" y="530" class="h">Scoped application services</text><text x="700" y="558" class="t">Existing packs · handoff renderer</text><text x="700" y="580" class="t">source directory · source body</text><text x="700" y="603" class="tiny">Local SQLite or Supabase service client</text>

  <rect x="1100" y="510" width="70" height="90" rx="10" class="box" stroke="#a78bfa"/>
  <text x="1113" y="548" class="h">Data</text><text x="1111" y="573" class="tiny">workspace</text>

  <rect x="650" y="92" width="545" height="550" rx="18" class="boundary"/>
  <text x="1030" y="118" class="tiny">UNDERLYING DEPTH APP</text>

  <text x="345" y="350" class="tiny">session-authenticated token management</text>
  <text x="585" y="174" class="tiny">HTTPS + Bearer</text>

  <rect x="45" y="655" width="14" height="14" rx="3" fill="#0f172a" stroke="#22d3ee"/><text x="68" y="667" class="tiny">MCP adapter</text>
  <rect x="190" y="655" width="14" height="14" rx="3" fill="#0f172a" stroke="#34d399"/><text x="213" y="667" class="tiny">HTTP application</text>
  <rect x="365" y="655" width="14" height="14" rx="3" fill="#0f172a" stroke="#fb7185"/><text x="388" y="667" class="tiny">Security boundary</text>
  <rect x="555" y="655" width="14" height="14" rx="3" fill="#0f172a" stroke="#a78bfa"/><text x="578" y="667" class="tiny">Data/services</text>
</svg>
